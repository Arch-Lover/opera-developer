name: Build AUR Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build in Arch Linux container
      uses: addnab/docker-run-action@v3
      with:
        image: archlinux:latest
        options: --volume ${{ github.workspace }}:/repo --workdir /repo
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo wget

          # Create non-root builder user
          useradd -m -G wheel mojarch
          echo '%wheel ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

          # Run the build as mojarch (adjust if your PKGBUILD is in a subdir)
          su - mojarch -c "
            cd /repo
            makepkg -si --noconfirm
          "

