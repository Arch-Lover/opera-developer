name: Build AUR Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build in Arch Linux container
      uses: addnab/docker-run-action@v3
      with:
        image: archlinux:latest
        options: --volume ${{ github.workspace }}:/src --workdir /src
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo wget

          # Create non-root builder user
          useradd -m -G wheel mojarch
          echo '%wheel ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

          # Copy source to user's home (ensures correct ownership)
          sudo -u mojarch cp -r /src /home/mojarch/build
          sudo -u mojarch chmod -R u+w /home/mojarch/build

          # Build as mojarch, forcing BUILDDIR to a safe location
          su - mojarch -c "
            cd /home/mojarch/build
            BUILDDIR=/home/mojarch/build-dir makepkg -si --noconfirm
          "

          # Optional: clean up sudoers
          sed -i '/%wheel ALL=(ALL) NOPASSWD: ALL/d' /etc/sudoers
