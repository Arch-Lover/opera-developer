name: Check upstream versions

on:
  schedule:
    # Daily at 06:20 UTC. Scheduled workflows run from the default branch.
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out package recipe
        uses: actions/checkout@v4

      - name: Compare packaged and upstream versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          opera_current="$(sed -n 's/^pkgver=//p' PKGBUILD)"
          ffmpeg_current="$(sed -n 's/^_nwjs_ffmpeg_version=//p' PKGBUILD)"

          opera_latest="$({
            curl --fail --location --retry 3 --silent --show-error \
              https://get.opera.com/pub/opera-developer/ |
              grep -oE 'href="[0-9]+(\.[0-9]+){3}/"' |
              sed -E 's/^href="|\/"$//g' |
              sort -V |
              tail -n1
          })"

          ffmpeg_latest="$({
            curl --fail --location --retry 3 --silent --show-error \
              https://api.github.com/repos/nwjs-ffmpeg-prebuilt/nwjs-ffmpeg-prebuilt/releases/latest |
              jq --raw-output '.tag_name' |
              sed 's/^v//'
          })"

          version_pattern='^[0-9]+(\.[0-9]+){2,3}$'
          [[ "$opera_current" =~ $version_pattern && "$opera_latest" =~ $version_pattern ]] || {
            echo 'Could not determine a valid Opera version.' >&2
            exit 1
          }
          [[ "$ffmpeg_current" =~ $version_pattern && "$ffmpeg_latest" =~ $version_pattern ]] || {
            echo 'Could not determine a valid NW.js FFmpeg version.' >&2
            exit 1
          }

          {
            echo "opera_current=$opera_current"
            echo "opera_latest=$opera_latest"
            echo "ffmpeg_current=$ffmpeg_current"
            echo "ffmpeg_latest=$ffmpeg_latest"
            if [[ "$opera_current" != "$opera_latest" || "$ffmpeg_current" != "$ffmpeg_latest" ]]; then
              echo 'updates_available=true'
            else
              echo 'updates_available=false'
            fi
          } >> "$GITHUB_OUTPUT"

          echo "Packaged Opera: $opera_current; upstream Opera: $opera_latest"
          echo "Packaged FFmpeg: $ffmpeg_current; upstream FFmpeg: $ffmpeg_latest"

      - name: Generate updated package metadata
        if: steps.versions.outputs.updates_available == 'true'
        env:
          OPERA_CURRENT: ${{ steps.versions.outputs.opera_current }}
          OPERA_LATEST: ${{ steps.versions.outputs.opera_latest }}
          FFMPEG_CURRENT: ${{ steps.versions.outputs.ffmpeg_current }}
          FFMPEG_LATEST: ${{ steps.versions.outputs.ffmpeg_latest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$OPERA_CURRENT" != "$OPERA_LATEST" ]]; then
            pkgrel=1
          else
            pkgrel="$(( $(sed -n 's/^pkgrel=//p' PKGBUILD) + 1 ))"
          fi

          sed -i -E \
            -e "s/^pkgver=.*/pkgver=$OPERA_LATEST/" \
            -e "s/^pkgrel=.*/pkgrel=$pkgrel/" \
            -e "s/^_nwjs_ffmpeg_version=.*/_nwjs_ffmpeg_version=$FFMPEG_LATEST/" \
            PKGBUILD

          output_dir="$RUNNER_TEMP/checksums"
          mkdir -p "$output_dir"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/source:ro" \
            --volume "$output_dir:/out" \
            archlinux:latest bash -euo pipefail -c '
              pacman -Syu --noconfirm
              useradd --create-home builder
              cp -a /source/. /build
              chown -R builder:builder /build
              runuser -u builder -- bash -c "cd /build && makepkg -g" > /out/sha256sums
            '

          awk -v sums="$(<"$output_dir/sha256sums")" '
            /^sha256sums=\(/ { print sums; skip = 1; next }
            # The final checksum and closing parenthesis share one line.
            skip && /\)[[:space:]]*$/ { skip = 0; next }
            !skip { print }
          ' PKGBUILD > PKGBUILD.updated
          mv PKGBUILD.updated PKGBUILD

      - name: Create or update the approval pull request
        if: steps.versions.outputs.updates_available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OPERA_LATEST: ${{ steps.versions.outputs.opera_latest }}
          FFMPEG_LATEST: ${{ steps.versions.outputs.ffmpeg_latest }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/upstream-${OPERA_LATEST}-${FFMPEG_LATEST}"
          existing_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')"
          if [[ -n "$existing_pr" ]]; then
            echo "Approval pull request #$existing_pr is already open."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A previous run may already have created this automation branch.
          # Fetching first lets --force-with-lease safely replace only that
          # bot-owned branch with the regenerated package recipe.
          git fetch origin "$branch" || true
          git checkout -B "$branch"
          git add PKGBUILD
          git commit -m "Update Opera Developer to $OPERA_LATEST"
          git push --force-with-lease origin "$branch"

          title="Update Opera Developer to $OPERA_LATEST"
          gh pr create --base main --head "$branch" --title "$title" --body \
            "Automated upstream update. Source checksums were regenerated. Review FFmpeg compatibility before approving and merging."
